<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — CoinTrail</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #0f172a;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        text-align: center;
        padding: 24px;
      }
      .badge {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: #0284c7;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 700;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: #64748b;
        margin: 0 0 20px;
        max-width: 320px;
      }
      button {
        border: none;
        background: #0284c7;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 999px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="badge">T</div>
      <h1>You're offline</h1>
      <p>CoinTrail needs a connection to load your team's data. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
